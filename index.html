<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pull.AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f5f7fb;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:40px 20px;
}

.logo{
    text-align:center;
    font-size:72px;
    font-weight:900;
    letter-spacing:-2px;
    margin-top:60px;
    margin-bottom:40px;
}

.logo span:nth-child(1){color:#4285F4;}
.logo span:nth-child(2){color:#EA4335;}
.logo span:nth-child(3){color:#FBBC05;}
.logo span:nth-child(4){color:#34A853;}
.logo span:nth-child(5){color:#4285F4;}
.logo span:nth-child(6){color:#EA4335;}
.logo span:nth-child(7){color:#FBBC05;}

.search-wrapper{
    width:100%;
    display:flex;
    justify-content:center;
}

.search-box{
    width:100%;
    max-width:800px;

    display:flex;
    align-items:center;

    background:white;

    border:1px solid #dfe1e5;

    border-radius:999px;

    padding:16px 24px;

    box-shadow:0 4px 15px rgba(0,0,0,.08);

    transition:.2s;
}

.search-box:hover{
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.search-box:focus-within{
    border-color:#4285F4;
}

.search-box input{
    flex:1;
    border:none;
    outline:none;
    font-size:18px;
    background:none;
}

.actions{
    text-align:center;
    margin-top:25px;
}

button{
    border:none;
    background:#4285F4;
    color:white;

    padding:12px 28px;

    border-radius:12px;

    cursor:pointer;

    font-size:15px;
    font-weight:bold;

    transition:.2s;
}

button:hover{
    transform:translateY(-2px);
}

.results{
    margin-top:50px;
    background:white;
    border-radius:20px;
    padding:25px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.section-title{
    font-size:20px;
    font-weight:bold;
    margin-bottom:20px;
}

.gcse-search{
    width:100%;
}

footer{
    text-align:center;
    margin-top:50px;
    color:#666;
    font-size:14px;
}

@media(max-width:700px){

    .logo{
        font-size:52px;
    }

    .search-box{
        padding:14px 18px;
    }

}

</style>
</head>

<body>

<div class="container">

    <div class="logo">
        <span>P</span><span>u</span><span>l</span><span>l</span><span>.</span><span>A</span><span>I</span>
    </div>

    <div class="search-wrapper">
        <div class="search-box">
            <input
                id="searchInput"
                type="text"
                placeholder="Pesquisar na web..."
            >
        </div>
    </div>

    <div class="actions">
        <button onclick="doSearch()">
            Buscar
        </button>
    </div>

    <div class="results">
        <div class="section-title">
            Resultados
        </div>

        <div class="gcse-search"></div>
    </div>

    <footer>
        Pull.AI
    </footer>

</div>

<script async src="https://cse.google.com/cse.js?cx=456655f16500e46db"></script>

<script>

function doSearch(){

    const query =
    document.getElementById("searchInput").value.trim();

    if(!query) return;

    const wait = setInterval(() => {

        if(
            window.google &&
            google.search &&
            google.search.cse &&
            google.search.cse.element
        ){

            clearInterval(wait);

            const element =
            google.search.cse.element.getElement('standard0');

            if(element){
                element.execute(query);
            }

        }

    },200);

}

document
.getElementById("searchInput")
.addEventListener("keydown", function(e){

    if(e.key === "Enter"){
        doSearch();
    }

});

</script>

</body>
</html>
